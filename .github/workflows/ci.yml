name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Locked Windows validation
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install LLVM 19
        shell: pwsh
        run: choco install llvm --version=19.1.7 --allow-downgrade --yes --no-progress

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run check

      - name: Audit JavaScript dependencies
        run: npm run audit

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: >
          cargo audit --deny unsound
          --ignore RUSTSEC-2026-0221
          --ignore RUSTSEC-2024-0429

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint locked Rust targets
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test locked Rust targets
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build and verify Windows installer
        run: npm run release:windows
