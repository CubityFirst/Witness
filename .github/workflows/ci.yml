name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # whisper-rs-sys runs bindgen; LLVM stays on 19.x (see CLAUDE.md).
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  validate:
    name: Locked Windows validation
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 19
        shell: pwsh
        run: choco install llvm --version=19.1.7 --allow-downgrade --yes --no-progress

      # Dependencies only (workspace crates always rebuild). Saved from master
      # alone, so PRs and release tags restore it without thrashing the 10 GB
      # cache quota; Cargo.lock and the toolchain are part of the key.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # ort-sys links onnxruntime from its download cache outside target/ and
      # copies its DLLs next to the binaries (dist packages them); the Rust
      # cache keeps neither. Dropping its fingerprints reruns its build script.
      - name: Rerun the ort-sys build script
        run: if (Test-Path target) { Get-ChildItem target/*/.fingerprint/ort-sys-* -Directory | Remove-Item -Recurse -Force }

      # Prebuilt binary (compiling it took ~6 minutes per run).
      - name: Install RustSec audit tool
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      # RUSTSEC-2024-0429 (glib, unsound) is reached only through muda's Linux
      # GTK backend (tray-icon) and is never compiled on Windows. The
      # event-listener advisory (RUSTSEC-2026-0221) left with Tauri.
      # RUSTSEC-2026-0381 matches webpki-roots 0.26.11 (ureq 2, hf-hub's
      # major), the last 0.26 release: a semver shim that re-exports
      # TLS_SERVER_ROOTS from webpki-roots 1, which is on the fixed 1.0.10.
      - name: Audit Rust dependencies
        run: cargo audit --deny unsound --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0381

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint locked Rust targets
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test locked Rust targets
        run: cargo test --workspace --locked

      - name: Check the release configuration
        run: cargo run --locked -p xtask -- check

  dist:
    name: Unsigned installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Pin the target dir so the artifact path below is known (xtask dist
      # resolves it through cargo metadata either way).
      CARGO_TARGET_DIR: ${{ github.workspace }}\target

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 19
        shell: pwsh
        run: choco install llvm --version=19.1.7 --allow-downgrade --yes --no-progress

      # NSIS 3.11 + nsis_tauri_utils 0.5.3, keyed on their pinned SHA-256s
      # (xtask/src/nsis.rs; a test keeps this key in sync, and the xtask
      # re-verifies cached files anyway).
      - name: Cache the NSIS toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/witness-build
          key: nsis-c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1-utils-5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # ort-sys links onnxruntime from its download cache outside target/ and
      # copies its DLLs next to the binaries (dist packages them); the Rust
      # cache keeps neither. Dropping its fingerprints reruns its build script.
      - name: Rerun the ort-sys build script
        run: if (Test-Path target) { Get-ChildItem target/*/.fingerprint/ort-sys-* -Directory | Remove-Item -Recurse -Force }

      - name: Build the installer
        run: cargo run --locked -p xtask -- dist

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-installer
          path: target/release/bundle/nsis/Witness_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

      # The upgrade smoke test needs a version above the shipped 0.2.1. Until
      # the release PR bumps the workspace, `dist` stamps 0.2.1 itself, which
      # makes the /UPDATE run a same-version reinstall and its DisplayVersion
      # checks vacuous. Same binaries and installer script, rehearsal version
      # (above any real release) stamped in.
      - name: Package a higher-version rehearsal installer
        run: cargo run --locked -p xtask -- package --srcdir target/release --version 99.0.0 --out target/release/Witness_99.0.0_x64-setup.exe

      - name: Upload the rehearsal installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-installer-rehearsal
          path: target/release/Witness_99.0.0_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  upgrade-smoke:
    # Guards the update contract every installed 0.2.x copy relies on: install
    # the shipped 0.2.1, update over it the way its updater does, and assert
    # registry, shortcuts + AUMID, autostart and data survival.
    name: Upgrade from 0.2.1
    needs: dist
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The 99.0.0 rehearsal build of this PR's installer: a real
          # version increase over 0.2.1 (see the dist job).
          name: witness-installer-rehearsal
          path: installer-under-test

      - name: Install 0.2.1, update over it, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-under-test -Filter "Witness_*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer artifact" }
          ./installer/tests/upgrade-smoke.ps1 -NewInstaller $setup.FullName
          exit $LASTEXITCODE

      - name: Signatures pass the 0.2.x client's checks
        run: cargo test --locked -p xtask sig_compat
