[package]
name = "witness-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Witness backend: capture, transcription, archive and the UI-agnostic service layer"
publish = false

[lib]
name = "witness_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
simplelog = "0.12"
crossbeam-channel = "0.5"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
hound = "3.5"
rubato = "0.16"
audiopus = "0.2"
ogg = "0.9"
# Pure-Rust VAD: voice_activity_detector pins ort =2.0.0-rc.10 which clashes
# with parakeet-rs (ort 2.0.0-rc.13), so we use earshot instead.
earshot = "1.1"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
sha2 = "0.10"
hex = "0.4"
# Git pin until 0.3.8 (Nemotron 3 Diarization / Sortformer v3, which also
# drops v2 support) reaches crates.io — swap back to `version = "0.3.8"` then.
parakeet-rs = { git = "https://github.com/altunenes/parakeet-rs", rev = "4fa6bdae61aa27b67f1de9590d180ca7092577f0", features = ["cuda", "sortformer"] }
whisper-rs = "0.14"
# Speaker embeddings run through our own ort session; version MUST stay
# pinned to whatever parakeet-rs uses (shared ort-sys).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray"] }
# GPU library installer (gpu_libs.rs) and the native updater: ureq matches
# hf-hub's major so the tree keeps a single copy. Default features stay on
# (gpu_libs relies on `tls`); native-tls adds the SChannel connector the
# updater uses so enterprise roots from the Windows store are trusted.
ureq = { version = "2", features = ["native-tls", "proxy-from-env"] }
native-tls = "0.2"
# zip reads the NVIDIA wheel archives (deflate).
zip = { version = "2", default-features = false, features = ["deflate"] }
ndarray = "0.17"
realfft = "3"
# Native updater (service/updater.rs): exactly the verifier
# tauri-plugin-updater 2.12.0 used, so every existing signature still checks.
minisign-verify = "=0.2.5"
semver = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
winreg = "0.55"
# Standalone WinRT toast crate (the one tauri-plugin-notification wrapped).
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  # The AI service's API key lives in Windows Credential Manager (credentials.rs).
  "Win32_Security_Credentials",
] }

[dev-dependencies]
# Throwaway-key fixtures for the updater signature tests.
minisign = "=0.7.3"

[features]
default = []
# Whisper runs on CPU by default; CUDA needs the CUDA toolkit at build time.
whisper-cuda = ["whisper-rs/cuda"]
